<div class="container-fluid mt-4">

    <h3 class="mb-4" id="pageTitle">Actividades</h3>

    <!-- ================================
         Card: Nueva actividad
         ================================ -->
    <div class="card border-secondary mb-3 w-100">

        <div class="card-header">
            <span>Registrar actividad</span>
        </div>

        <div class="card-body">
            <form id="actividadForm">
                <fieldset>
                    <div class="row g-3">

                        <!-- Columna izquierda -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="actTipo" class="form-label">Tipo</label>
                                <select class="form-select" id="actTipo">
                                    <option value="" selected disabled>Seleccione un tipo</option>
                                    <option>Actividad</option>
                                    <option>Tarea</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="actTitulo" class="form-label">Título</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="actTitulo"
                                    placeholder="Título de la actividad"
                                    required />
                            </div>

                            <div class="mb-3">
                                <label for="actDescripcion" class="form-label">Descripción</label>
                                <textarea
                                    class="form-control"
                                    id="actDescripcion"
                                    rows="3"
                                    placeholder="Detalle de la actividad"></textarea>
                            </div>
                        </div>

                        <!-- Columna derecha -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="actColaborador" class="form-label">Colaborador</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="actColaborador"
                                    placeholder="Nombre del colaborador" />
                            </div>

                            <div class="mb-3">
                                <label for="actDepartamento" class="form-label">Departamento</label>
                                <select class="form-select" id="actDepartamento">
                                    <option value="" selected disabled>Seleccione un departamento</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="actPrioridad" class="form-label">Prioridad</label>
                                <select class="form-select" id="actPrioridad">
                                    <option value="" selected disabled>Seleccione una prioridad</option>
                                    <option>Baja</option>
                                    <option>Media</option>
                                    <option>Alta</option>
                                </select>
                            </div>
                        </div>

                    </div>

                    <!-- Botones: debajo de ambas columnas, ancho completo -->
                    <div class="d-flex gap-2 mt-2">
                        <button type="submit" id="btnGuardarActividad" class="btn btn-primary">
                            Guardar
                        </button>

                        <button type="reset" id="btnLimpiarActividad" class="btn btn-secondary">
                            Limpiar
                        </button>
                    </div>
                </fieldset>
            </form>
        </div>

    </div>

    <!-- ================================
         Card: Lista de actividades
         ================================ -->
    <div class="card border-secondary mb-3 w-100">

        <div class="card-header">
            <span>Actividades registradas</span>
        </div>

        <div class="card-body">

            <!-- Filtros -->
            <div class="actividades-filtros mb-3">
                <div>
                    <label for="filtroActTexto" class="form-label">Buscar</label>
                    <input
                        type="search"
                        id="filtroActTexto"
                        class="form-control"
                        placeholder="Título, descripción o colaborador" />
                </div>

                <div>
                    <label for="filtroActEstatus" class="form-label">Estatus</label>
                    <select id="filtroActEstatus" class="form-select">
                        <option value="">Todos</option>
                        <option>Por hacer</option>
                        <option>En progreso</option>
                        <option>Hecho</option>
                    </select>
                </div>

                <div>
                    <label for="filtroActTipo" class="form-label">Tipo</label>
                    <select id="filtroActTipo" class="form-select">
                        <option value="">Todos</option>
                        <option>Actividad</option>
                        <option>Tarea</option>
                    </select>
                </div>

                <div>
                    <label for="filtroActPrioridad" class="form-label">Prioridad</label>
                    <select id="filtroActPrioridad" class="form-select">
                        <option value="">Todas</option>
                        <option>Baja</option>
                        <option>Media</option>
                        <option>Alta</option>
                    </select>
                </div>

                <div class="actividades-filtros-acciones">
                    <button
                        type="button"
                        id="btnLimpiarFiltrosActividades"
                        class="btn btn-outline-secondary">
                        Limpiar
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table id="tablaActividades" class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Tipo</th>
                            <th scope="col">Título</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Colaborador</th>
                            <th scope="col">Departamento</th>
                            <th scope="col">Prioridad</th>
                            <th scope="col">Estatus</th>
                            <th scope="col">Fecha creación</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>

                    <tbody>
                        <!-- Filas generadas dinámicamente desde actividades.js -->
                    </tbody>
                </table>
            </div>

            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-3">
                <small id="actividadesPaginacionInfo" class="text-muted"></small>

                <nav aria-label="Paginación de actividades">
                    <ul id="actividadesPaginacion" class="pagination pagination-sm mb-0">
                        <!-- Botones de paginación generados desde actividades.js -->
                    </ul>
                </nav>
            </div>
        </div>

    </div>

</div>

<script src="../js/actividades.js"></script>
