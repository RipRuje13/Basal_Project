
<div class="container-fluid mt-4" id="dashboardRoot">

    <h3 id="pageTitle" class="mb-4">Dashboard</h3>

    <div class="row g-3" id="dashboardCards">

        <div class="col-md-6 col-lg-3">

                    <h6>Compras Pendientes</h6>
                    <h2 id="totalComprasPendientes">0</h2>

            </div>
        </div>

        <div class="col-md-6 col-lg-3">
            <div id="cardComprasAprobadas" class="card text-center">

        <div class="col-md-6 col-lg-3">
